name: Deploy site

# Source lives here; the built site is pushed to srujaniyengar/srujaniyengar.github.io,
# the only repo GitHub serves at https://srujaniyengar.github.io/ (root, no subpath).
# That repo is a deploy target only: never edit it by hand, every deploy replaces it.
# Needs secret SITE_DEPLOY_KEY: private half of a deploy key with write access
# on srujaniyengar.github.io (and nothing else).

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Push build to srujaniyengar.github.io
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          cd dist
          touch .nojekyll
          git init -q -b main
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy srujaniyengar/srujaniyengar@${GITHUB_SHA}"
          # Force push: the target keeps only the latest build; history lives in this repo.
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            git push -f git@github.com:srujaniyengar/srujaniyengar.github.io.git main
